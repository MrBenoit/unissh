name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser нужен полный лог для changelog
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Гейт: без зелёных тестов (включая -race) и покрытия ядра >= 90%
      # релиз не публикуется. В .goreleaser.yaml есть свои before-hooks —
      # они страхуют локальный `make release`.
      - name: Test, race, vet, coverage gate, build
        run: make ci

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
