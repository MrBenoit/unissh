name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Единственный источник правды — Makefile: локально и в CI гоняется одно и то же.
      # `make ci` = test → test-race → vet → гейт покрытия → сборка.
      # Сборка не выполняется ни на красных тестах, ни при покрытии ядра ниже 90%.
      - name: Format check
        run: make fmt-check
      - name: Test, race, vet, coverage gate, build
        run: make ci

      - name: Smoke test
        run: ./unissh version

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.1

  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # go.mod/go.sum должны быть в актуальном состоянии — иначе `go install` у
      # пользователя подтянет не то, что мы тестировали.
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
