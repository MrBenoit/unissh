name: 🐛 Bug report
description: Something is broken
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: unissh version
      description: Output of `unissh version`
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal
      placeholder: Warp / iTerm2 / Terminal.app / kitty / alacritty …
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do, what did you expect, what happened?
    validations:
      required: true
